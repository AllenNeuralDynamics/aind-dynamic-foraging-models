name: Lint and run tests

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10' ]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: | 
        python -m pip install -e .[dev]
    - name: Run linter checks
      run: flake8 . && interrogate --verbose .
    - name: Run tests and coverage
      run: coverage run -m unittest discover && coverage report

  # The hierarchical Bayesian subpackage needs JAX, which requires Python >= 3.10.
  # It runs as a separate job so the core 3.9/3.10 matrix above stays untouched.
  hierarchical-bayes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11' ]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install -e .[dev,bayes]
    - name: Run linter checks
      run: flake8 src/aind_dynamic_foraging_models/hierarchical_bayes tests/test_hb_*.py && interrogate --verbose src/aind_dynamic_foraging_models/hierarchical_bayes
    - name: Run hierarchical Bayes tests with coverage
      # AIND_HB_REQUIRE_DEPS=1: this job installs [bayes], so a failed import is a bug,
      # not a reason to skip. Without it a broken extra reports OK with every sampler
      # test silently skipped, and only the coverage number gives it away.
      env:
        AIND_HB_REQUIRE_DEPS: "1"
      run: |
        coverage run --rcfile=.coveragerc-hb -m unittest discover -s tests -p "test_hb_*.py" -v
        coverage report --rcfile=.coveragerc-hb
