[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-dynamic-foraging-models"
description = "Generated from aind-library-template"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
dynamic = ["version"]

dependencies = [
    'numpy',
    'matplotlib',
    'scikit-learn',
    'scipy',
    'pydantic',
]

[project.optional-dependencies]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo',
    'aind-behavior-gym',
    'aind_dynamic_foraging_basic_analysis',
]

rl = [
    'aind-behavior-gym',
    'aind_dynamic_foraging_basic_analysis',
]

bayes = [
    # jax and numpyro must be bounded together. numpyro < 0.20 imports
    # jax.interpreters.pxla.xla_pmap_p, which jax removed after 0.6, so an unbounded
    # 'jax' here resolves to a version numpyro cannot import at all.
    'jax>=0.4.25,<0.7',
    # Ceiling, not caution: numpyro >= 0.20 requires jax >= 0.7, while the disRNN
    # wrapper pins jax[cuda12]==0.6.1 for the GRU and disRNN models. Raising this
    # would move jax underneath models validated at 0.6.1 for no benefit here --
    # the full hierarchical-Bayes suite passes on 0.19. Revisit when that pin moves.
    'numpyro<0.20',
    # BOUNDED ON PURPOSE, and the bound is the point. Unbounded, this resolved to
    # different MAJOR versions depending on the resolver -- pip in the Beaker image gave
    # 1.3.0 while conda in a validation env gave 0.23.4 -- and the two lines disagree on
    # fundamentals: `InferenceData` is a class on 0.x but an alias for `xarray.DataTree`
    # on 1.x, and `.groups` is a method returning bare names on 0.x but a property
    # returning node paths on 1.x. A change to artifacts.py validated on one line then
    # crashed every HB run on the other (#64, #68). One declared line instead of
    # compatibility code for a version nobody runs.
    #
    # 1.x is chosen because it is what the image already resolves and what the HB suite
    # has actually run on: the D10 rungs of study 08 completed on arviz 1.3.0. Pinning
    # 0.x instead would force an image rebuild and a downgrade to no benefit. Bounded
    # below 2 because that line does not exist yet and its API is unknown.
    #
    # Consequence to know before installing: every arviz 1.x wheel declares
    # `requires_python >=3.12`, so **this extra needs Python 3.12+** even though the package
    # as a whole still supports 3.9. `pip install -e .[bayes]` on 3.10/3.11 fails outright
    # with "No matching distribution found for arviz<2,>=1.0". That is deliberate -- the
    # alternative is a marker that silently installs no arviz and dies later on
    # `import arviz` -- and it matches where this code runs: beaker/Dockerfile is
    # `FROM python:3.12-slim`.
    'arviz>=1.0,<2',

    'xarray',     # reading the persisted netCDF back
    'h5netcdf',   # netCDF engine; without one xarray falls back to scipy's netCDF3
                  # writer, which cannot store the string attributes ArviZ attaches
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aind_dynamic_foraging_models.__version__"}

[tool.black]
line-length = 100
target_version = ['py36']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | code
  )/
  | .gitignore
)
'''

[tool.coverage.run]
# hierarchical_bayes needs the `bayes` extra, which the core 3.9/3.10 matrix does not
# install (JAX requires >= 3.10), so its modules and tests cannot execute there and would
# otherwise count as wholly uncovered. The dedicated 3.11 job measures them instead.
omit = [
    "*__init__*",
    "*/hierarchical_bayes/*",
    "*/tests/test_hb_*",
]
source = ["aind_dynamic_foraging_models", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "from",
    "import",
    "pragma: no cover"
]
fail_under = 80

[tool.isort]
line_length = 100
profile = "black"
skip = [
    "code/",
]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", "code"]
fail-under = 80
