name: Lint and run tests

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10' ]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: | 
        python -m pip install -e .[dev]
    - name: Run linter checks
      run: flake8 . && interrogate --verbose .
    - name: Run tests and coverage
      run: coverage run -m unittest discover && coverage report

  # The hierarchical Bayesian subpackage needs JAX, which requires Python >= 3.10.
  # It runs as a separate job so the core 3.9/3.10 matrix above stays untouched.
  hierarchical-bayes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11' ]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install -e .[dev,bayes]
    - name: Run linter checks
      run: flake8 src/aind_dynamic_foraging_models/hierarchical_bayes tests/test_hb_hattori_parity.py && interrogate --verbose src/aind_dynamic_foraging_models/hierarchical_bayes
    - name: Run hierarchical Bayes tests
      run: python -m unittest tests.test_hb_hattori_parity -v
